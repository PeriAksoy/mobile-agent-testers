# Publishes the online demo of the dashboard (made-up data only) to GitHub Pages.
name: Dashboard demo
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "scripts/dashboard.py", "scripts/dashboard_demo.py", "scripts/ecr_trace.py"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python3 scripts/dashboard.py --demo --export site/
      - name: Is GitHub Pages on
        id: pages
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is off. Turn it on in Settings > Pages > Source: GitHub Actions, then run this workflow again."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'true'
        with: { path: site }
      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
